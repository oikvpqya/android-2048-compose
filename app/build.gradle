compose {
    desktop {
        application {
            mainClass = "MainKt"

            nativeDistributions {
                targetFormats(TargetFormat.Dmg, TargetFormat.Msi, TargetFormat.Deb)
                packageName = "com.alexjlockwood.twentyfortyeightcompose"
                packageVersion = "1.0.0"
            }
        }
    }

    experimental {
        web.application {}
    }

    resources {
        packageOfResClass "com.alexjlockwood.twentyfortyeight"

        kotlin.targets.configureEach { target ->
            if (target.platformType == KotlinPlatformType.common) {
                return
            }
            if (target.platformType == KotlinPlatformType.androidJvm) {
                androidComponents {
                    onVariants(selector().all()) { variant ->
                        String suffix = "${target.name}${replaceFirstCharToUpper(variant.name)}"
                        customDirectory(suffix, licenseeResourcesDirectoryPropertyProvider(suffix, variant.runtimeConfiguration))
                    }
                }
            } else {
                String suffix = "${target.name}${replaceFirstCharToUpper(KotlinCompilation.MAIN_COMPILATION_NAME)}"
                KotlinCompilation compilation = target.compilations.getByName(KotlinCompilation.MAIN_COMPILATION_NAME)
                String configurationName
                if (compilation.runtimeDependencyConfigurationName != null) {
                    configurationName = compilation.runtimeDependencyConfigurationName
                } else {
                    configurationName = compilation.compileDependencyConfigurationName
                }
                customDirectory(suffix, licenseeResourcesDirectoryPropertyProvider(suffix, configurations.getByName(configurationName)))
            }
        }
    }
}

licensee {
    allow "Apache-2.0"
}

private static String replaceFirstCharToUpper(String input) {
    return input.substring(0,1).toUpperCase() + input.substring(1)
}

private Provider<DirectoryProperty> licenseeResourcesDirectoryPropertyProvider(String suffix, Configuration configuration) {
    return tasks.register("licenseeGenerateResources${replaceFirstCharToUpper(suffix)}", LicenseeTask) {
        configurationToCheck configuration
        outputDir.set(layout.buildDirectory.dir(Paths.get("generated", "licensee", suffix, "files").toString()))
    }.map {
        layout.buildDirectory.dir(Paths.get("generated", "licensee", suffix).toString()).get()
    }
}
