compose {
    desktop {
        application {
            mainClass = "MainKt"

            nativeDistributions {
                targetFormats(TargetFormat.Dmg, TargetFormat.Msi, TargetFormat.Deb)
                packageName = "com.alexjlockwood.twentyfortyeightcompose"
                packageVersion = "1.0.0"
            }
        }
    }

    experimental {
        web.application {}
    }

    resources {
        packageOfResClass "com.alexjlockwood.twentyfortyeight"

        kotlin.targets.configureEach { target ->
            if (target.platformType == KotlinPlatformType.common) {
                return
            }
            if (target.platformType == KotlinPlatformType.androidJvm) {
                androidComponents {
                    onVariants(selector().all()) { variant ->
                        String suffix = "${target.name}${replaceFirstCharWithUpperCase(variant.name)}"
                        customDirectory(suffix, licenseeResourcesDirectory(suffix, provider { variant.runtimeConfiguration }))
                    }
                }
            } else {
                String compilationName = KotlinCompilation.MAIN_COMPILATION_NAME
                String suffix = "${target.name}${replaceFirstCharWithUpperCase(compilationName)}"
                Provider<Configuration> configuration = target.compilations.named(compilationName).map { compilation ->
                    String configurationName = compilation.runtimeDependencyConfigurationName
                    if (configurationName != null) {
                        configurations.named(configurationName).get()
                    } else {
                        configurations.named(compilation.compileDependencyConfigurationName).get()
                    }
                }
                customDirectory(suffix, licenseeResourcesDirectory(suffix, configuration))
            }
        }
    }
}

licensee {
    allow "Apache-2.0"
}

private static String replaceFirstCharWithUpperCase(String input) {
    return input.substring(0,1).toUpperCase() + input.substring(1)
}

private Provider<DirectoryProperty> licenseeResourcesDirectory(String suffix, Provider<Configuration> configuration) {
    return tasks.register("licenseeGenerateResources${replaceFirstCharWithUpperCase(suffix)}", LicenseeTask) {
        configurationToCheck configuration.get()
        outputDir.set(layout.buildDirectory.dir(Paths.get("generated", "licensee", suffix, "files").toString()))
    }.map {
        layout.buildDirectory.dir(Paths.get("generated", "licensee", suffix).toString()).get()
    }
}
